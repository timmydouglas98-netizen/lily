<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Margot Lisle</title>
<meta name="description" content="Margot Lisle is a stylist and artist in Paris working across styling, art direction, photography and moving image.">
<meta property="og:title" content="Margot Lisle">
<meta property="og:description" content="Styling, art direction, photography and moving image.">
<meta property="og:type" content="website">
<meta property="og:image" content="/images/og.jpg">
<meta name="theme-color" content="#F8E5E1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Mono&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="cover">
<button class="skip meta" type="button" onclick="document.getElementById('view').focus()">Skip to content</button>
<header class="masthead">
  <div class="mast-inner">
    <a class="mast-name meta" href="#cover">Margot Lisle</a>
    <nav class="mast-nav meta" aria-label="Primary">
      <a href="#index">Index</a>
      <a href="#archive">Archive</a>
      <a href="#info">Info</a>
      <a href="#contact">Contact</a>
    </nav>
    <button class="mast-toggle meta" type="button" aria-expanded="false" aria-controls="overlay">Index</button>
  </div>
</header>

<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Menu" hidden>
  <button class="overlay-close meta" type="button">Close</button>
  <ol class="pages">
    <li><a href="#cover">Cover</a></li>
    <li><a href="#index">Index</a></li>
    <li><a href="#archive">Archive</a></li>
    <li><a href="#info">Info</a></li>
    <li><a href="#contact">Contact</a></li>
  </ol>
  <div class="projects">
    <p class="meta muted">Contents</p>
    <ol></ol>
  </div>
</div>

<main id="view" tabindex="-1"></main>

<footer class="colophon">
  <div class="wrap grid12 meta">
    <p class="c1">© <span data-year>2026</span> <span data-name>Margot Lisle</span></p>
    <p class="c2">Set in Inter, Newsreader and Space Mono. Twelve columns on an 8px baseline.</p>
    <p class="c3" data-credit></p>
    <p class="c4">All images copyright the artist. No commercial use without written permission.</p>
  </div>
</footer>

<dialog id="lb" class="lb" aria-label="Image viewer">
  <div class="lb-bar meta">
    <span class="lb-count"></span>
    <div class="ctl">
      <button type="button" data-lb="prev">← Previous</button>
      <button type="button" data-lb="next">Next →</button>
      <button type="button" data-lb="close">Close</button>
    </div>
  </div>
  <div class="lb-stage"></div>
  <div class="lb-cap meta"></div>
</dialog>

<noscript><p class="wrap">This site needs JavaScript to show the work.</p></noscript>
<script src="app.js"></script>
</body>
</html>
